# Firebase App Hosting config — only needed if you deploy via
# `firebase init apphosting` / `firebase deploy --only apphosting`.
# This app is a standard Next.js app and can also be deployed to Vercel or
# any Node host; see README.md "Deploying" for both paths.

runConfig:
  minInstances: 0
  maxInstances: 3

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://spicymamastudio.com"
    availability:
      - BUILD
      - RUNTIME
